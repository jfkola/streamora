{% extends "base.html" %}
{% block title %}Streamora - Login{% endblock %}

{% block content %}
<style>
.auth-wrapper {
    position: relative;
    width: 100vw;
    height: calc(100vh - 86px);
    display: flex;
    align-items: center;
    justify-content: center;
    margin-top: -86px;
    background: linear-gradient(to bottom, rgba(15,15,15,0.7), rgba(15,15,15,1)),
                url("https://images.unsplash.com/photo-1595769816263-9b910be24d5f?ixlib=rb-4.0.3&auto=format&fit=crop&w=1920&q=80") center/cover no-repeat;
}

.auth-card {
    background: rgba(20, 20, 20, 0.7);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 1px solid rgba(255, 255, 255, 0.1);
    border-radius: 20px;
    padding: 50px 40px;
    width: 100%;
    max-width: 450px;
    box-shadow: 0 25px 50px rgba(0,0,0,0.8);
}

.auth-card .form-control {
    background: rgba(0,0,0,0.5);
    border: 1px solid rgba(255,255,255,0.1);
    color: white;
    padding: 15px 20px;
    border-radius: 10px;
}
.auth-card .form-control:focus {
    background: rgba(0,0,0,0.8);
    border-color: var(--brand-red);
    box-shadow: 0 0 10px rgba(229,9,20,0.3);
}
</style>

<div class="auth-wrapper">
    <div class="auth-card">
        <div class="text-center mb-4">
            <h2 class="fw-bold text-white mb-2">Welcome Back</h2>
            <p class="text-muted">Sign in to continue to <span style="color: var(--brand-red); font-weight:800;">Streamora</span></p>
        </div>

        <form method="POST">
            <div class="mb-3 position-relative">
                <i class="fa fa-user position-absolute text-muted" style="top: 18px; left: 15px;"></i>
                <input name="username" class="form-control ps-5" placeholder="Username" required>
            </div>
            
            <div class="mb-4 position-relative">
                <i class="fa fa-lock position-absolute text-muted" style="top: 18px; left: 15px;"></i>
                <input name="password" type="password" class="form-control ps-5" placeholder="Password" required>
            </div>
            
            <button class="btn btn-brand w-100 py-3 rounded-3 mb-3 fs-5">Sign In</button>
        </form>

        <div class="text-center mt-3">
            <span class="text-muted">New to Streamora?</span> 
            <a href="/register" class="text-white fw-bold text-decoration-none ms-1 hover-red" style="transition: color 0.2s;">Sign up now</a>
        </div>
    </div>
</div>
{% endblock %}
